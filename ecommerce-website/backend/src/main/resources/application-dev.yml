server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/resellmart_db
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    database: mysql
  sql:
    init:
      mode: always

  mail:
    host: localhost
    port: 1025
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          trust: "*"
        auth: true
        starttls:
          enable: true
        connectiontimeout: 5000
        timeout: 3000
        writetimeout: 5000

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY}
      access-token:
        expiration: 1800000 # 30 minutes
      refresh-token:
        expiration: 604800000 # 1 week
  frontend:
    base-url: "http://localhost:5173"

  mailing:
    activation-url: "/auth/activation?code="

